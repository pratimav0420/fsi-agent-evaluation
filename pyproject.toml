[project]
name = "fsi-agent-eval"
version = "0.2.0"
description = "FSI Agent Evaluation Starter Kit"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
azure = [
    "azure-ai-evaluation==1.18.3",
    "azure-ai-projects==2.4.0",
    "azure-identity>=1.19.0",
    "openai>=2.8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
fsi-agent-eval = "fsi_agent_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsi_agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires Azure credentials and Foundry endpoint (deselect with '-m not live')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
