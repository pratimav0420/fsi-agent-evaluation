[project]
name = "fsi-agent-eval"
version = "0.1.0"
description = "FSI Agent Evaluation Starter Kit"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
azure = [
    "azure-ai-agents>=1.2.0b5",
    "azure-ai-evaluation>=1.18.0",
    "azure-ai-projects>=2.0.0b1",
    "azure-identity>=1.19.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsi_agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires Azure credentials and Foundry endpoint (deselect with '-m not live')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
