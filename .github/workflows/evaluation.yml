name: Agent evaluation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: mkdir -p artifacts
      - run: pytest -m "not live" --cov=fsi_agent_eval --cov-fail-under=70 --junitxml=artifacts/tests.xml
      - run: fsi-agent-eval validate
      - run: fsi-agent-eval baseline --cases evaluations/datasets/seed-cases.yaml --output artifacts/pull-request
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-evaluation-evidence
          path: artifacts/
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  foundry-validation:
    if: github.event_name != 'pull_request'
    needs: offline-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: foundry-validation
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[azure,dev]"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run sanitized Foundry spike
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_DEPLOYMENT_NAME: ${{ vars.FOUNDRY_DEPLOYMENT_NAME }}
        run: python spikes/foundry_process_evaluation/run_spike.py
      - name: Verify normalized live gate decisions
        run: |
          fsi-agent-eval replay --bundle data/offline-bundle/live-pass.json --output artifacts/live-pass
          if fsi-agent-eval replay --bundle data/offline-bundle/live-broken-order.json --output artifacts/live-broken; then
            echo "The intentional negative control did not block."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundry-validation-evidence
          path: |
            spikes/foundry_process_evaluation/expected_outputs/
            artifacts/
          retention-days: 90
