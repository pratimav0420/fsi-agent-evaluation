name: Agent evaluation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run credential-dependent Foundry validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -m "not live" --junitxml=artifacts/tests.xml
      - run: fsi-agent-eval validate
      - run: fsi-agent-eval baseline --cases evaluations/datasets/seed-cases.yaml --output artifacts/pull-request
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evaluation-evidence
          path: artifacts/
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}

  foundry-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    environment: foundry-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[azure,dev]"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run sanitized Foundry spike
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_NAME: ${{ vars.FOUNDRY_MODEL_NAME }}
        run: python spikes/foundry_process_evaluation/run_spike.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-validation-evidence
          path: spikes/foundry_process_evaluation/expected_outputs/
          retention-days: 90
